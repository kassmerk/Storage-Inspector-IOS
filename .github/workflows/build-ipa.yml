name: Build unsigned IPA

# Запуск вручную кнопкой "Run workflow" в GitHub, либо автоматически при пуше.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID — должен совпасть с App ID в профиле Feather (для wildcard-профиля можно не менять)"
        required: false
        default: com.example.storageinspector
      ipa_name:
        description: "Имя файла .ipa (без расширения)"
        required: false
        default: StorageInspector
      runner:
        description: "Образ macOS-раннера. ПУСТО = macos-latest (или переменная MACOS_RUNNER). Другой вариант: macos-15-intel"
        required: false
        default: ""
  push:
    branches:
      - main
      - master

permissions:
  contents: read

# Пуш за пушем не должны занимать очередь раннеров: новый запуск отменяет предыдущий.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: xcodebuild -> StorageInspector.ipa
    # macos-latest — всегда существующий образ GitHub (xcodebuild + Xcode последней версии).
    # Явные образы вроде macos-14 периодически выводятся из эксплуатации и падают
    # с ошибкой "The configuration ... is not supported".
    #
    # Если сборка падает с "The job was not acquired by Runner of type hosted" — это нехватка
    # раннеров на стороне GitHub, а не ошибка проекта: запустите Re-run jobs или выберите
    # другой образ (Run workflow → runner, либо переменная репозитория MACOS_RUNNER:
    # Settings → Secrets and variables → Actions → Variables). У *-intel образов отдельный
    # пул машин, поэтому они часто доступны, когда arm64-очередь забита.
    # Поле runner в Run workflow по умолчанию пустое — тогда работает цепочка ниже
    # (переменная MACOS_RUNNER → macos-latest); впишите macos-15-intel, чтобы уйти на Intel-пул.
    runs-on: ${{ github.event.inputs.runner || vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 40
    env:
      BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.example.storageinspector' }}
      IPA_NAME: ${{ github.event.inputs.ipa_name || 'StorageInspector' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize line endings
        run: |
          # Files are edited on Windows: CRLF makes bash die on the first line of a script,
          # so strip the carriage returns before anything is executed.
          find . -type f \( -name '*.sh' -o -name '*.swift' -o -name '*.pbxproj' \) -print0 \
            | xargs -0 perl -pi -e 's/\r\n/\n/g'
          chmod +x tools/build-ipa.sh

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Locate the Xcode project
        id: locate
        run: |
          set -euo pipefail
          PROJ=$(find . -maxdepth 5 -name "StorageInspector.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "StorageInspector.xcodeproj not found in the repository" >&2
            exit 1
          fi
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJ"

      - name: Build without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ steps.locate.outputs.project }}" \
            -scheme StorageInspector \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package into a Feather-ready IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 3 -name "StorageInspector.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "StorageInspector.app was not produced by the build" >&2
            exit 1
          fi
          echo "App bundle: $APP"
          echo "--- Info.plist ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          test -f "$APP/Assets.car"

          echo "--- Loose icon files (Feather and the Home Screen use them) ---"
          ICON_SRC=$(find . -maxdepth 8 -name "AppIcon-1024.png" -path "*AppIcon.appiconset*" | head -n 1)
          if [ -n "$ICON_SRC" ]; then
            for pair in "AppIcon60x60@2x.png:120" "AppIcon60x60@3x.png:180" "AppIcon40x40@2x.png:80" "AppIcon40x40@3x.png:120" "AppIcon29x29@2x.png:58" "AppIcon29x29@3x.png:87"; do
              ICON_NAME=${pair%%:*}
              ICON_SIZE=${pair##*:}
              sips -z "$ICON_SIZE" "$ICON_SIZE" "$ICON_SRC" --out "$APP/$ICON_NAME" >/dev/null
            done
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$APP/Info.plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$APP/Info.plist" || true
            echo "Generated from $ICON_SRC"
          else
            echo "AppIcon-1024.png not found; the icon stays inside Assets.car"
          fi
          echo "--- Alternate icons for Settings -> App Icon ---"
          VARIANT_DIR=""
          for candidate in ./StorageInspector/Resources/AppIconVariants ./Resources/AppIconVariants; do
            if [ -d "$candidate" ]; then
              VARIANT_DIR="$candidate"
              break
            fi
          done
          if [ -n "$VARIANT_DIR" ]; then
            ALT_KEYS=""
            for entry in "IconIndigo:icon-indigo" "IconGraphite:icon-graphite" "IconCrimson:icon-crimson"; do
              KEY=${entry%%:*}
              FILE=${entry##*:}
              SRC="$VARIANT_DIR/$FILE.png"
              if [ ! -f "$SRC" ]; then
                echo "warning: $SRC is missing - the $KEY icon is skipped"
                continue
              fi
              sips -z 120 120 "$SRC" --out "$APP/$KEY@2x.png" >/dev/null
              sips -z 180 180 "$SRC" --out "$APP/$KEY@3x.png" >/dev/null
              ALT_KEYS="$ALT_KEYS $KEY"
            done
            if [ -n "$ALT_KEYS" ]; then
              # `CFBundleAlternateIcons` is nested inside `CFBundleIcons`, and its keys have to be
              # the names passed to `UIApplication.setAlternateIconName(_:)` (`IconIndigo`).
              /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons:CFBundleAlternateIcons" "$APP/Info.plist" >/dev/null 2>&1 || true
              if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist" >/dev/null 2>&1; then
                /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$APP/Info.plist"
              fi
              /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons dict" "$APP/Info.plist"
              for KEY in $ALT_KEYS; do
                /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$KEY dict" "$APP/Info.plist"
                /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$KEY:CFBundleIconFiles array" "$APP/Info.plist"
                /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundleAlternateIcons:$KEY:CFBundleIconFiles:0 string $KEY" "$APP/Info.plist"
              done
              echo "Alternate icons:$ALT_KEYS (orange stays the primary icon)"
              /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons" "$APP/Info.plist" | head -n 20
            fi
          else
            echo "AppIconVariants folder not found - only the primary icon is available"
          fi

          /usr/libexec/PlistBuddy -c "Add :LSRequiresIPhoneOS bool true" "$APP/Info.plist" >/dev/null 2>&1 || true

          echo "--- Remove stale signatures (Feather signs everything itself) ---"
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision" "$APP/SC_Info"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 2 -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          fi

          echo "--- Pack Payload/StorageInspector.app ---"
          find "$APP" -name ".DS_Store" -delete 2>/dev/null || true
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -q -r -y -9 "${IPA_NAME}-unsigned.ipa" Payload -x "*.DS_Store"
          unzip -l "${IPA_NAME}-unsigned.ipa" | head -n 6
          ls -lh "${IPA_NAME}-unsigned.ipa"

      - name: Write install hint
        run: |
          {
            echo "### Неподписанный IPA готов"
            echo ""
            echo "- файл: ${IPA_NAME}-unsigned.ipa"
            echo "- bundle id: ${BUNDLE_ID}"
            echo ""
            echo "Feather → Settings → Certificates → Import (.p12 + пароль) → Import Provisioning Profile → «+» → выбрать .ipa → Sign → Install."
            echo ""
            echo "App ID в профиле должен совпадать с ${BUNDLE_ID}, либо профиль должен быть wildcard (TEAMID.*)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}-unsigned-ipa
          path: out/${{ env.IPA_NAME }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

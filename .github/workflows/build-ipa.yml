name: Build unsigned IPA

# Запуск вручную кнопкой "Run workflow" в GitHub, либо автоматически при пуше.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID — должен совпасть с App ID в профиле Feather (для wildcard-профиля можно не менять)"
        required: false
        default: com.example.storageinspector
      ipa_name:
        description: "Имя файла .ipa (без расширения)"
        required: false
        default: StorageInspector
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ipa:
    name: xcodebuild -> StorageInspector.ipa
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.example.storageinspector' }}
      IPA_NAME: ${{ github.event.inputs.ipa_name || 'StorageInspector' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Locate the Xcode project
        id: locate
        run: |
          set -euo pipefail
          PROJ=$(find . -maxdepth 5 -name "StorageInspector.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "StorageInspector.xcodeproj not found in the repository" >&2
            exit 1
          fi
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJ"

      - name: Build without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ steps.locate.outputs.project }}" \
            -scheme StorageInspector \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package into a Feather-ready IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 3 -name "StorageInspector.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "StorageInspector.app was not produced by the build" >&2
            exit 1
          fi
          echo "App bundle: $APP"
          echo "--- Info.plist ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          test -f "$APP/Assets.car"

          echo "--- Loose icon files (Feather and the Home Screen use them) ---"
          ICON_SRC=$(find . -maxdepth 8 -name "AppIcon-1024.png" -path "*AppIcon.appiconset*" | head -n 1)
          if [ -n "$ICON_SRC" ]; then
            for pair in "AppIcon60x60@2x.png:120" "AppIcon60x60@3x.png:180" "AppIcon40x40@2x.png:80" "AppIcon40x40@3x.png:120" "AppIcon29x29@2x.png:58" "AppIcon29x29@3x.png:87"; do
              ICON_NAME=${pair%%:*}
              ICON_SIZE=${pair##*:}
              sips -z "$ICON_SIZE" "$ICON_SIZE" "$ICON_SRC" --out "$APP/$ICON_NAME" >/dev/null
            done
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$APP/Info.plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" "$APP/Info.plist" || true
            echo "Generated from $ICON_SRC"
          else
            echo "AppIcon-1024.png not found; the icon stays inside Assets.car"
          fi
          /usr/libexec/PlistBuddy -c "Add :LSRequiresIPhoneOS bool true" "$APP/Info.plist" >/dev/null 2>&1 || true

          echo "--- Remove stale signatures (Feather signs everything itself) ---"
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision" "$APP/SC_Info"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 2 -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          fi

          echo "--- Pack Payload/StorageInspector.app ---"
          find "$APP" -name ".DS_Store" -delete 2>/dev/null || true
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -q -r -y -9 "${IPA_NAME}-unsigned.ipa" Payload -x "*.DS_Store"
          unzip -l "${IPA_NAME}-unsigned.ipa" | head -n 6
          ls -lh "${IPA_NAME}-unsigned.ipa"

      - name: Write install hint
        run: |
          {
            echo "### Неподписанный IPA готов"
            echo ""
            echo "- файл: ${IPA_NAME}-unsigned.ipa"
            echo "- bundle id: ${BUNDLE_ID}"
            echo ""
            echo "Feather → Settings → Certificates → Import (.p12 + пароль) → Import Provisioning Profile → «+» → выбрать .ipa → Sign → Install."
            echo ""
            echo "App ID в профиле должен совпадать с ${BUNDLE_ID}, либо профиль должен быть wildcard (TEAMID.*)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}-unsigned-ipa
          path: out/${{ env.IPA_NAME }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
